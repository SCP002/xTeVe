version: "2"

linters:
  enable:
    - lll
    # Empty lines at the start and end of blocks.
    - whitespace
    # Simplifications with newer Go features, as gopls suggests them.
    - modernize
  settings:
    govet:
      enable:
        # Conditions that are always true or false because of nil checks.
        - nilness
    lll:
      line-length: 120
      tab-width: 4
    staticcheck:
      checks:
        - all
        # Package comments and exported identifier comments are not required.
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
