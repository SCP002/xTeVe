services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: xteve-dev
    init: true
    command: sleep infinity
    working_dir: /workspace
    # xTeVe and the Vite dev server of the web UI, reachable from the host also without VS Code
    ports:
      - "34400:34400"
      - "5173:5173"
    volumes:
      - .:/workspace:cached
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - claude_config:/root/.claude
      - xteve_config:/root/.xteve
      # node_modules of the web UI in a volume: much faster than the bind mount on Windows
      - web_node_modules:/workspace/web/node_modules
    environment:
      - CLAUDE_CONFIG_DIR=/root/.claude
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

volumes:
  go_mod_cache:
  go_build_cache:
  claude_config:
  xteve_config:
  web_node_modules:
